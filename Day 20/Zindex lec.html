<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .box-1{
            height: 200px;
            width:200px ;
            background-color: red;
            position: absolute;
            top: 90px;
            left: 50px;
            z-index: 1;
        }
        .box-2{
            height: 200px;
            width: 200px;
            background-color: blue;
            position: absolute;
            top: 120px;
            left: 120px;
            z-index: 2;
        }
    </style>
</head>
<body>
      <h1>CSS z index lecture</h1>

    <div class="box-1">
        box-1
    </div>

    <div class="box-2">
        box-2
    </div>
    
</body>
</html>
