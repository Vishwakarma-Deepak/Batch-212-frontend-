<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

</head>

<style>
    /* descendant selector */
    /* div p{
        color: red;
    } */

    /* child selector */
    div>p{
        color: red;

    }
</style>

<body>
    <div>
        <p>This is para 1</p>
        <p>This is para 2</p>
        <p>This is para 3</p>
        <p>This is para 4</p>

        <span>
            <p>This is para 5</p>
            <p>This is para 6</p>
            <p>This is para 7 </p>
        </span>
    </div>

    <p>This is para 8</p>
    <p>This is para 9</p>

</body>

</html>
