<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: aqua;
            margin: 20px;
            border: 3px solid black;
            width: 200px;
            height: 200px;
            text-align: center;
            display: inline-block;
        }

        .relativebox{
            position: relative;
            top: 20px;
            left: 50px;

        }

        .absoluteclass{
            position: absolute;
            top: 70px;
            left: 50px;

        }


    </style>
</head>

<body>
    <div class="box ">one</div>
    <div class="box absoluteclass">two</div>
    <div class="box">three</div>
    
</body>
</html>
