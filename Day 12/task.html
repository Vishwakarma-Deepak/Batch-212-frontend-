<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .image{
            height: 150px;
            width: 150px;
            border: 2px solid black;
            margin: 20px;
        }
        .grid{
            display: grid;
            grid-template-columns: repeat(3,1fr);

        }
      
    </style>
   
</head>
<body>
    <div class="grid">
         <img src="image.png" alt="" class="image">
        <img src="dora.jpg" alt="" class="image">
        <img src="facebook.jpg" alt="" class="image">
        <img src="momo.jpg" alt="" class="image">
        <img src="insta.jpg" alt="" class="image">
        <img src="juju.jpg" alt="" class="image">
    </div>

    
        
    
</body>
</html>
