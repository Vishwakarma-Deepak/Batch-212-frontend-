<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <i>this is italic tag</i>
    <br>
    <!-- bold and strong are same  -->
    <b>this is bold tag</b>
    <br>
    <strong>this is strong tag</strong>
    <br>
    <em>this is emaphasize tag</em>
    <br>
    <!-- underline and insert are same  -->
    <u>this is underline tag</u>
    <br>
    <ins>this is insert tag</ins>
    <br>
    <mark>this is mark tag</mark>
    <!-- Superscript -->
    <p>Today's Date:17 <sup>th</sup>Aug </p>
    <!-- subscript -->
    <p>Water formula: H <sub>2</sub>O</p>

    <small>Deepak </small>
    <big>Deepak </big>

</body>
</html>
