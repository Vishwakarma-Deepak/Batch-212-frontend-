<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
              display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box1{
            height: 100px;
            width: 100px;
            background-color: red;
          


            animation: rotatebox 3s infinite;
        }
         @keyframes rotatebox {

                0%{
                    transform:rotate(0deg);
                }

                100%{
                    transform:rotate(360deg);
                }
                
            }
    </style>
</head>
<body>

    <div class="box">

        <div class="box1"></div>

    </div>
    
</body>
</html>
